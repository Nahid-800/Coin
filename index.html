<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DeepSeek Chat</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Custom scrollbar */
    #chat-container::-webkit-scrollbar {
      width: 6px;
    }
    #chat-container::-webkit-scrollbar-track {
      background: transparent;
    }
    #chat-container::-webkit-scrollbar-thumb {
      background: #404040;
      border-radius: 10px;
    }

    /* Code block */
    pre {
      position: relative;
      background: #1e1e1e;
      border-radius: 12px;
      padding: 16px;
      overflow-x: auto;
      margin: 12px 0;
      border: 1px solid #333;
    }

    pre code {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
      font-size: 13.5px;
      line-height: 1.55;
      color: #e5e5e5;
      white-space: pre;
    }

    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #333;
      color: #d4d4d4;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .copy-btn:hover {
      background: #404040;
      color: white;
    }

    .copy-btn.copied {
      background: #166534;
      color: #bbf7d0;
    }

    /* Markdown simple styles */
    .content p {
      margin-bottom: 10px;
    }

    .content ul, .content ol {
      margin: 8px 0 8px 20px;
    }

    .content li {
      margin-bottom: 4px;
    }

    .content strong {
      font-weight: 600;
      color: #f5f5f5;
    }

    .content a {
      color: #60a5fa;
      text-decoration: underline;
    }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-200 h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="flex items-center justify-between px-4 py-3 border-b border-neutral-800 bg-neutral-900/80 backdrop-blur sticky top-0 z-10">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center font-bold text-white text-sm">AI</div>
      <div>
        <h1 class="text-base font-semibold text-white leading-tight">DeepSeek Chat</h1>
        <p class="text-xs text-neutral-400">deepseek-v4.1-flash</p>
      </div>
    </div>
  </header>

  <!-- Chat Area -->
  <div id="chat-container" class="flex-1 overflow-y-auto px-3 py-5 space-y-6 scroll-smooth">
    <!-- Messages will be injected here -->
  </div>

  <!-- Input Area -->
  <div class="border-t border-neutral-800 bg-neutral-900/90 backdrop-blur px-3 pt-3 pb-4 sm:pb-5">
    <div class="max-w-3xl mx-auto relative">
      <textarea
        id="user-input"
        rows="1"
        placeholder="মেসেজ লিখুন... (Enter = পাঠান)"
        class="w-full bg-neutral-800 border border-neutral-700 rounded-2xl text-neutral-100 placeholder-neutral-500 text-[15px] sm:text-sm px-4 py-3.5 pr-14 resize-none outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all min-h-[52px] max-h-[160px] leading-relaxed"
      ></textarea>

      <button
        id="send-btn"
        class="absolute right-2.5 bottom-2.5 w-9 h-9 rounded-xl bg-blue-600 hover:bg-blue-500 disabled:opacity-40 disabled:cursor-not-allowed text-white flex items-center justify-center transition-all"
        title="পাঠান"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m22 2-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
    <p id="error-msg" class="text-center text-red-400 text-xs mt-2 hidden"></p>
  </div>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const errorMsg = document.getElementById('error-msg');

    let messages = [];
    let isGenerating = false;

    // Auto resize
    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
    });

    // Enter to send
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    // ========== Markdown-like renderer (code blocks + basic formatting) ==========
    function renderContent(text) {
      // Escape HTML first
      let html = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // Code blocks ```lang\ncode\n```
      html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (match, lang, code) => {
        const id = 'code-' + Math.random().toString(36).substr(2, 9);
        return `
          <pre>
            <button class="copy-btn" onclick="copyCode('${id}', this)">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              Copy
            </button>
            <code id="${id}">${code.trim()}</code>
          </pre>
        `;
      });

      // Inline code `code`
      html = html.replace(/`([^`]+)`/g, '<code class="bg-neutral-800 px-1.5 py-0.5 rounded text-emerald-400 text-[13px]">$1</code>');

      // Bold **text**
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

      // Line breaks
      html = html.replace(/\n/g, '<br>');

      return html;
    }

    // Copy function
    window.copyCode = function(id, btn) {
      const code = document.getElementById(id).innerText;
      navigator.clipboard.writeText(code).then(() => {
        btn.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
          Copied!
        `;
        btn.classList.add('copied');
        setTimeout(() => {
          btn.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy
          `;
          btn.classList.remove('copied');
        }, 1800);
      });
    };

    function addMessage(role, content = '') {
      const div = document.createElement('div');
      div.className = `flex gap-3 max-w-3xl mx-auto w-full message-${role}`;

      const avatarColor = role === 'user' ? 'bg-blue-600' : 'bg-emerald-500';
      const avatarText = role === 'user' ? 'U' : 'AI';

      div.innerHTML = `
        <div class="w-8 h-8 rounded-lg ${avatarColor} flex items-center justify-center text-white text-sm font-semibold flex-shrink-0 mt-0.5">
          ${avatarText}
        </div>
        <div class="flex-1 content text-[15px] leading-relaxed pt-0.5 min-w-0"></div>
      `;

      const contentEl = div.querySelector('.content');
      if (content) {
        contentEl.innerHTML = renderContent(content);
      }

      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return contentEl;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || isGenerating) return;

      isGenerating = true;
      sendBtn.disabled = true;
      errorMsg.classList.add('hidden');

      // User message
      addMessage('user', text);
      messages.push({ role: 'user', content: text });

      userInput.value = '';
      userInput.style.height = 'auto';

      // Assistant empty message
      const assistantContentEl = addMessage('assistant', '');
      let fullReply = '';

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages })
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.error || `HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = line.slice(6).trim();
              if (data === '[DONE]') continue;

              try {
                const parsed = JSON.parse(data);
                const content = parsed.choices?.[0]?.delta?.content || '';
                if (content) {
                  fullReply += content;
                  // Live update (simple text while streaming)
                  assistantContentEl.textContent = fullReply;
                  chatContainer.scrollTop = chatContainer.scrollHeight;
                }
              } catch (e) {}
            }
          }
        }

        // Final render with code blocks
        if (fullReply) {
          assistantContentEl.innerHTML = renderContent(fullReply);
          messages.push({ role: 'assistant', content: fullReply });
        } else {
          assistantContentEl.textContent = 'কোনো উত্তর পাওয়া যায়নি।';
        }

      } catch (err) {
        assistantContentEl.textContent = 'Error: ' + err.message;
        errorMsg.textContent = 'Error: ' + err.message;
        errorMsg.classList.remove('hidden');
        console.error(err);
      } finally {
        isGenerating = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    // Focus
    userInput.focus();
  </script>
</body>
</html>
