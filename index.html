<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DeepSeek Chatbot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0f0f0f;
      color: #e5e5e5;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      padding: 14px 16px;
      border-bottom: 1px solid #262626;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #141414;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1 {
      font-size: 17px;
      font-weight: 600;
      color: #f5f5f5;
    }

    .header .badge {
      font-size: 12px;
      color: #a3a3a3;
      background: #262626;
      padding: 3px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }

    /* Chat Area */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      max-width: 100%;
      width: 100%;
      display: flex;
      gap: 12px;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      font-weight: 600;
    }

    .user .avatar {
      background: #3b82f6;
      color: white;
    }

    .assistant .avatar {
      background: #22c55e;
      color: white;
    }

    .content {
      flex: 1;
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
      padding-top: 4px;
    }

    .user .content {
      color: #f5f5f5;
    }

    .assistant .content {
      color: #d4d4d4;
    }

    /* Input Area */
    .input-area {
      border-top: 1px solid #262626;
      background: #141414;
      padding: 12px 12px 16px;
      flex-shrink: 0;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }

    .input-wrapper {
      position: relative;
      max-width: 900px;
      margin: 0 auto;
    }

    textarea {
      width: 100%;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 16px;
      color: #e5e5e5;
      font-size: 16px; /* iOS zoom prevent */
      padding: 14px 52px 14px 16px;
      resize: none;
      outline: none;
      min-height: 52px;
      max-height: 160px;
      line-height: 1.5;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    textarea:focus {
      border-color: #3b82f6;
    }

    textarea::placeholder {
      color: #737373;
    }

    #send-btn {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: none;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, opacity 0.2s;
    }

    #send-btn:hover:not(:disabled) {
      background: #2563eb;
    }

    #send-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .error {
      color: #f87171;
      font-size: 13px;
      margin-top: 8px;
      text-align: center;
    }

    /* Desktop */
    @media (min-width: 768px) {
      .header {
        padding: 16px 24px;
      }

      .header h1 {
        font-size: 18px;
      }

      #chat-container {
        padding: 24px 20px;
      }

      .message {
        max-width: 780px;
        margin: 0 auto;
      }

      .input-area {
        padding: 16px 24px 24px;
      }

      textarea {
        font-size: 15px;
        padding: 16px 56px 16px 18px;
        min-height: 56px;
        max-height: 200px;
      }
    }

    /* Very small screens */
    @media (max-width: 360px) {
      .header h1 {
        font-size: 15px;
      }
      .header .badge {
        font-size: 11px;
        padding: 2px 8px;
      }
      .content {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <h1>DeepSeek Chat</h1>
      <span class="badge">v4.1-flash</span>
    </div>
  </div>

  <div id="chat-container"></div>

  <div class="input-area">
    <div class="input-wrapper">
      <textarea
        id="user-input"
        placeholder="মেসেজ লিখুন..."
        rows="1"
      ></textarea>
      <button id="send-btn" title="পাঠান">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
    <div id="error-msg" class="error" style="display:none;"></div>
  </div>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const errorMsg = document.getElementById('error-msg');

    let messages = [];
    let isGenerating = false;

    // Auto-resize textarea
    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
    });

    // Enter = send, Shift+Enter = new line
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.innerHTML = `
        <div class="avatar">${role === 'user' ? 'U' : 'AI'}</div>
        <div class="content"></div>
      `;
      const contentEl = div.querySelector('.content');
      contentEl.textContent = content;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return contentEl;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || isGenerating) return;

      isGenerating = true;
      sendBtn.disabled = true;
      errorMsg.style.display = 'none';

      addMessage('user', text);
      messages.push({ role: 'user', content: text });

      userInput.value = '';
      userInput.style.height = 'auto';

      // Assistant message (empty at first)
      const assistantContentEl = addMessage('assistant', '');
      let fullReply = '';

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages })
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.error || `HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = line.slice(6).trim();
              if (data === '[DONE]') continue;

              try {
                const parsed = JSON.parse(data);
                const content = parsed.choices?.[0]?.delta?.content || '';
                if (content) {
                  fullReply += content;
                  assistantContentEl.textContent = fullReply;
                  chatContainer.scrollTop = chatContainer.scrollHeight;
                }
              } catch (e) {
                // ignore incomplete JSON
              }
            }
          }
        }

        if (fullReply) {
          messages.push({ role: 'assistant', content: fullReply });
        } else {
          assistantContentEl.textContent = 'কোনো উত্তর পাওয়া যায়নি।';
        }

      } catch (err) {
        assistantContentEl.textContent = 'Error: ' + err.message;
        errorMsg.textContent = 'Error: ' + err.message;
        errorMsg.style.display = 'block';
        console.error(err);
      } finally {
        isGenerating = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    // Focus on load
    userInput.focus();
  </script>
</body>
</html>
