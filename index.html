<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novita AI Chatbot</title>
  <!-- Marked.js for Markdown & Code formatting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .chat-container {
      width: 100%;
      max-width: 520px;
      height: 85vh;
      max-height: 750px;
      background: #1e1e2f;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #3a3a5c;
    }

    .chat-header {
      background: linear-gradient(90deg, #6c5ce7, #a29bfe);
      color: white;
      padding: 18px 20px;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 600;
    }

    .chat-header small {
      display: block;
      font-size: 0.75rem;
      opacity: 0.9;
      margin-top: 4px;
      font-weight: 400;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user-message {
      align-self: flex-end;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: white;
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }

    .bot-message {
      align-self: flex-start;
      background: #2d2d44;
      color: #e0e0e0;
      border-bottom-left-radius: 4px;
      width: 100%;
    }

    .bot-message.typing {
      color: #aaa;
      font-style: italic;
      width: auto;
    }

    /* Markdown & Code Block Styling */
    .bot-message p {
      margin-bottom: 8px;
    }
    .bot-message p:last-child {
      margin-bottom: 0;
    }
    .bot-message ul, .bot-message ol {
      margin-left: 20px;
      margin-bottom: 8px;
    }
    .bot-message strong {
      color: #ffffff;
    }

    .code-container {
      background: #151521;
      border-radius: 8px;
      border: 1px solid #3a3a5c;
      margin: 10px 0;
      overflow: hidden;
    }

    .code-header {
      background: #22223b;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: #b8b8d0;
      border-bottom: 1px solid #3a3a5c;
      font-family: monospace;
    }

    .copy-btn {
      background: transparent;
      border: none;
      color: #b8b8d0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background 0.2s, color 0.2s;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .bot-message pre {
      padding: 12px;
      overflow-x: auto;
      margin: 0;
      background: transparent;
    }

    .bot-message code {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
      font-size: 0.88rem;
      color: #f8f8f2;
    }

    .bot-message p code {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 5px;
      border-radius: 4px;
      color: #ff79c6;
    }

    .chat-input-area {
      padding: 16px;
      background: #2a2a40;
      display: flex;
      gap: 10px;
      border-top: 1px solid #3a3a5c;
    }

    #user-input {
      flex: 1;
      padding: 14px 16px;
      border: none;
      border-radius: 25px;
      background: #1e1e2f;
      color: white;
      font-size: 1rem;
      outline: none;
      resize: none;
      max-height: 120px;
    }

    #user-input::placeholder {
      color: #888;
    }

    #send-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: white;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    #send-btn:hover {
      transform: scale(1.08);
    }

    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      Novita AI Chatbot
      <small>Ling 3.0 Flash VL via Novita AI</small>
    </div>

    <div class="chat-messages" id="chat-messages">
      <div class="message bot-message">
        হ্যালো! আমি রেডি। কোডিং বা অন্য যেকোনো বিষয়ে প্রশ্ন করতে পারেন।
      </div>
    </div>

    <div class="chat-input-area">
      <textarea id="user-input" rows="1" placeholder="মেসেজ লিখো..." onkeydown="handleKey(event)"></textarea>
      <button id="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script>
    let conversationHistory = [
      {
        role: "system",
        content: "You are a helpful, friendly AI assistant. Reply in the same language the user is using (Bengali or English). Format code snippets properly using markdown code blocks."
      }
    ];

    function handleKey(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    async function sendMessage() {
      const input = document.getElementById("user-input");
      const message = input.value.trim();

      if (!message) return;

      addUserMessage(message);
      input.value = "";
      input.style.height = "auto";

      const typingId = addMessage("লিখছি...", "bot", true);

      conversationHistory.push({ role: "user", content: message });

      const sendBtn = document.getElementById("send-btn");
      sendBtn.disabled = true;

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "inclusionai/ling-3.0-flash-vl", // সঠিক মডেল নাম এখানে দেওয়া হয়েছে
            messages: conversationHistory
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || data.message || `Error ${response.status}`);
        }

        const botReply = data.choices?.[0]?.message?.content || "কোনো উত্তর পাওয়া যায়নি।";

        removeMessage(typingId);
        addBotMessage(botReply);

        conversationHistory.push({ role: "assistant", content: botReply });

      } catch (error) {
        removeMessage(typingId);
        addBotMessage("❌ সমস্যা হয়েছে: " + error.message);
        console.error(error);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    function addUserMessage(text) {
      const container = document.getElementById("chat-messages");
      const div = document.createElement("div");
      div.className = "message user-message";
      div.textContent = text;
      div.id = "msg-" + Date.now();
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function addBotMessage(text) {
      const container = document.getElementById("chat-messages");
      const div = document.createElement("div");
      div.className = "message bot-message";
      div.innerHTML = renderMarkdown(text);
      div.id = "msg-" + Date.now();
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return div.id;
    }

    function addMessage(text, sender, isTyping = false) {
      const container = document.getElementById("chat-messages");
      const div = document.createElement("div");
      div.className = `message ${sender}-message${isTyping ? " typing" : ""}`;
      div.textContent = text;
      div.id = "msg-" + Date.now();
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return div.id;
    }

    function removeMessage(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function renderMarkdown(text) {
      let html = marked.parse(text);

      html = html.replace(/<pre><code(.*?>)([\s\S]*?)<\/code><\/pre>/g, (match, attr, codeContent) => {
        return `
          <div class="code-container">
            <div class="code-header">
              <span>Code Block</span>
              <button class="copy-btn" onclick="copyCodeSnippet(this)">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                Copy
              </button>
            </div>
            <pre><code${attr}${codeContent}</code></pre>
          </div>
        `;
      });

      return html;
    }

    function copyCodeSnippet(button) {
      const container = button.closest('.code-container');
      const codeElement = container.querySelector('code');
      const textToCopy = codeElement.innerText;

      navigator.clipboard.writeText(textToCopy).then(() => {
        const originalHTML = button.innerHTML;
        button.innerHTML = `
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
          Copied!
        `;
        button.style.color = '#4ade80';
        setTimeout(() => {
          button.innerHTML = originalHTML;
          button.style.color = '';
        }, 2000);
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }

    document.getElementById("user-input").addEventListener("input", function () {
      this.style.height = "auto";
      this.style.height = Math.min(this.scrollHeight, 120) + "px";
    });
  </script>
</body>
</html>
